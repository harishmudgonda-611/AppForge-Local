name: AppForge Local CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Extract source (once) and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract v3 application source when not yet present
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f server.py ]; then
            archive="AppForge-Local-Replica-Integrated-v3.zip"
            test -s "$archive"
            tmp="$(mktemp -d)"
            unzip -q "$archive" -d "$tmp"
            test -s "$tmp/appforge_local/server.py"
            cp -a "$tmp/appforge_local/." .
            rm -rf "$tmp"
            echo "extracted=true" >> "$GITHUB_OUTPUT"
          else
            echo "extracted=false" >> "$GITHUB_OUTPUT"
          fi
          test -s config.example.json
          test -d tests
          test -f server.py
          test -f advanced.py
      - name: Validate Python source and tests
        run: |
          python -m compileall -q server.py advanced.py tests
          python -m unittest discover -s tests -v
      - name: Validate browser JavaScript
        run: node --check static/app.js
      - name: Validate packaged ZIP archives
        shell: bash
        run: |
          set -euo pipefail
          for archive in AppForge-Local-Replica-Integrated-v3.zip "AppForge-Local-Advanced.zip"; do
            if [ -f "$archive" ]; then unzip -t "$archive"; fi
          done
      - name: Package current validated source
        shell: bash
        run: |
          set -euo pipefail
          package="AppForge-Local-source"
          mkdir -p "$package"
          cp -a server.py advanced.py static tests README.md LICENSE SECURITY.md CONTRIBUTING.md config.example.json start.sh start.bat "$package/"
          zip -qr AppForge-Local-source.zip "$package"
          unzip -t AppForge-Local-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AppForge-Local-source
          path: AppForge-Local-source.zip
          if-no-files-found: error
          retention-days: 14
