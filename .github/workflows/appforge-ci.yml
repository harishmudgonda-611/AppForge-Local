name: AppForge Local CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository and archive validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project documentation and archives
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          shopt -s nullglob
          archives=( *.zip )
          if [ \${#archives[@]} -eq 0 ]; then
            echo "::error::No packaged project archives found."
            exit 1
          fi
          for archive in "\${archives[@]}"; do
            echo "Checking $archive"
            unzip -t "$archive"
          done

  source-validation:
    name: Application source validation
    runs-on: ubuntu-latest
    needs: repository-validation
    if: \${{ hashFiles('appforge_local/server.py') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate expected source files
        run: |
          test -f appforge_local/advanced.py
          test -f appforge_local/static/index.html
          test -f appforge_local/static/app.js
          test -f appforge_local/static/styles.css
          test -d appforge_local/tests
      - name: Python compile check
        run: python -m compileall -q appforge_local
      - name: JavaScript syntax check
        run: node --check appforge_local/static/app.js
      - name: Run unit tests
        working-directory: appforge_local
        run: python -m unittest discover -s tests -v

  android-apk:
    name: Android debug APK build
    runs-on: ubuntu-latest
    needs: repository-validation
    if: \${{ hashFiles('appforge_local/android/gradlew', 'android/gradlew', 'gradlew') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Select Android project
        id: android
        shell: bash
        run: |
          if [ -f appforge_local/android/gradlew ]; then
            echo "project=appforge_local/android" >> "$GITHUB_OUTPUT"
          elif [ -f android/gradlew ]; then
            echo "project=android" >> "$GITHUB_OUTPUT"
          else
            echo "project=." >> "$GITHUB_OUTPUT"
          fi
      - name: Build and verify debug APK
        shell: bash
        working-directory: \${{ steps.android.outputs.project }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug
          apk="$(find . -path '*/build/outputs/apk/debug/*.apk' -type f -size +0c | head -n 1)"
          test -n "$apk"
          echo "Verified APK: $apk"
