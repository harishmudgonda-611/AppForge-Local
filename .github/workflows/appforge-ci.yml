name: AppForge Local CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository and archive validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project documentation and archives
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSE
          test -s CONTRIBUTING.md
          test -s SECURITY.md
          shopt -s nullglob
          archives=( *.zip )
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No packaged project archives found."
            exit 1
          fi
          for archive in "${archives[@]}"; do
            echo "Checking $archive"
            unzip -t "$archive"
          done
          echo "Repository documentation and packaged ZIP integrity checks passed."

# Application source tests and Android APK builds will be added when the
# extracted source tree and native Android Gradle project are committed.
