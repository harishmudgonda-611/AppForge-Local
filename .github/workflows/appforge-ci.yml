name: AppForge Local CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Source, syntax and API smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Locate and extract v3 source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f appforge_local/server.py ]; then
            found=""
            for archive in *.zip; do
              [ -f "$archive" ] || continue
              if unzip -Z1 "$archive" | grep -qx 'appforge_local/server.py'; then
                found="$archive"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "::error::Missing appforge_local/server.py. Commit the extracted Replica-Integrated-v3 source tree; an archive alone is not a source checkout."
              exit 1
            fi
            unzip -oq "$found" -d .
          fi
          test -f appforge_local/server.py
          test -f appforge_local/advanced.py
          test -f appforge_local/static/index.html
          test -f appforge_local/static/app.js
          test -f appforge_local/static/styles.css
          test -d appforge_local/tests

      - name: Python compile check
        run: python -m compileall -q appforge_local

      - name: JavaScript syntax check
        run: node --check appforge_local/static/app.js

      - name: Run unit tests (must not skip)
        working-directory: appforge_local
        run: python -m unittest discover -s tests -v

      - name: End-to-end HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd appforge_local
          APPFORGE_HOST=127.0.0.1 APPFORGE_PORT=8787 python server.py > /tmp/appforge-server.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /tmp/health.json; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/appforge-server.log; echo "::error::AppForge server did not become healthy"; exit 1; fi
          python - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as f:
              d=json.load(f)
          assert isinstance(d, dict), 'health response must be JSON object'
          assert d.get('ok') is True, f'health endpoint not OK: {d}'
          PY
          curl --fail --silent http://127.0.0.1:8787/ | grep -qi 'AppForge'
          curl --fail --silent http://127.0.0.1:8787/static/app.js | grep -q 'run-analysis'
          curl --fail --silent http://127.0.0.1:8787/api/projects | python -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d.get('projects'), list), d"
          curl --fail --silent -X POST http://127.0.0.1:8787/api/feedback -H 'Content-Type: application/json' -d '{"kind":"ci-smoke","feedback":"CI end-to-end smoke test"}' | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True, d"
          echo "HTTP smoke tests passed"

  android-apk:
    name: Required Android debug APK
    runs-on: ubuntu-latest
    needs: source-checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate native Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail
          if [ -f appforge_local/android/gradlew ]; then
            echo "project=appforge_local/android" >> "$GITHUB_OUTPUT"
          elif [ -f android/gradlew ]; then
            echo "project=android" >> "$GITHUB_OUTPUT"
          elif [ -f gradlew ]; then
            echo "project=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::No native Android Gradle project or Gradle wrapper is committed. CI is intentionally failing instead of reporting a false green APK build."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: ${{ steps.android.outputs.project }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK exists and is non-empty
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find "${{ steps.android.outputs.project }}" -path '*/build/outputs/apk/debug/*.apk' -type f -size +0c | head -n 1)"
          if [ -z "$apk" ]; then echo "::error::Gradle reported success but no non-empty debug APK was found."; exit 1; fi
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          ls -lh "$apk"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: appforge-local-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
