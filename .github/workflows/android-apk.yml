name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_slug:
        description: "Committed PWA folder under apps/ (for example my-first-app)"
        required: true
        default: android-smoke-test
        type: string
  pull_request:
    paths:
      - ".github/workflows/android-apk.yml"
      - "apps/android-smoke-test/**"

permissions:
  contents: read

jobs:
  android-debug:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate app slug and app directory
        id: validate
        shell: bash
        env:
          APP_SLUG: ${{ inputs.app_slug || 'android-smoke-test' }}
        run: |
          set -euo pipefail
          if [[ ! "$APP_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,48}$ ]]; then
            echo "Invalid app slug. Use letters, numbers, underscore or hyphen."
            exit 1
          fi
          APP_DIR="apps/$APP_SLUG"
          if [[ -L "$APP_DIR" || ! -d "$APP_DIR" ]]; then
            echo "App directory must be a real directory inside apps/."
            exit 1
          fi
          printf 'app_slug=%s\n' "$APP_SLUG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Capacitor 8 Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install app dependencies and validate
        working-directory: apps/${{ steps.validate.outputs.app_slug }}
        shell: bash
        run: |
          set -euo pipefail
          test -s package.json
          test -s package-lock.json
          test -s capacitor.config.json
          test -s index.html
          node -e "const p=require('./package.json'); const deps={...p.dependencies,...p.devDependencies}; for (const name of ['@capacitor/core','@capacitor/cli','@capacitor/android']) { if (!deps[name]) throw new Error('Missing required dependency: '+name); } if (!p.scripts?.build) throw new Error('Missing build script'); const c=require('./capacitor.config.json'); if (!c.appId || c.webDir !== 'dist') throw new Error('Capacitor appId and webDir=dist are required');"
          npm ci
          npm test --if-present
          npm run build
          test -s dist/index.html

      - name: Create Android project and sync Capacitor
        working-directory: apps/${{ steps.validate.outputs.app_slug }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          test -x android/gradlew

      - name: Build debug APK
        working-directory: apps/${{ steps.validate.outputs.app_slug }}/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        id: apk
        working-directory: apps/${{ steps.validate.outputs.app_slug }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          BADGING="$( "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" )"
          printf '%s\n' "$BADGING" | grep -F "package: name='" >/dev/null
          EXPECTED_ID="$(node -p "require('./capacitor.config.json').appId")"
          ACTUAL_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          if [ "$ACTUAL_ID" != "$EXPECTED_ID" ]; then
            echo "APK package ID mismatch: expected $EXPECTED_ID, got $ACTUAL_ID"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK" | tee APK-SHA256.txt

      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            set -euo pipefail
            adb install -r "apps/\${{ steps.validate.outputs.app_slug }}/\${{ steps.apk.outputs.path }}"
            adb shell am start -n com.appforge.androidsmoketest/.MainActivity
            sleep 8
            adb shell dumpsys activity activities | grep -F "com.appforge.androidsmoketest"

      - uses: actions/upload-artifact@v7
        with:
          name: appforge-${{ steps.validate.outputs.app_slug }}-debug-apk
          path: |
            apps/${{ steps.validate.outputs.app_slug }}/${{ steps.apk.outputs.path }}
            apps/${{ steps.validate.outputs.app_slug }}/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 7
